<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="痛いよー">
<title>痛いよーノート</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --fg:#2e3542; --muted:#7a8494;
  --line:#dde3ea; --face:#a9c4ec; --face-dark:#7e9fd4; --tear:#5f8fe0; --cheek:#f2b8c2;
  --down:#c9545f; --up:#3f8a6b; --danger:#c9545f;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1b2029; --card:#252b36; --fg:#e8ecf2; --muted:#9aa4b4;
  --line:#343c4a; --face:#7f9fd0; --face-dark:#5d7db3; --tear:#a8c6ff; --cheek:#d98a99;
  --down:#ef8790; --up:#7fcca8; --danger:#ef8790; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--round);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:18px;font-weight:700;margin:0;color:var(--muted);text-align:center;letter-spacing:.06em}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px}
#cry{width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:var(--face);box-shadow:0 10px 0 var(--face-dark),0 18px 30px rgba(60,90,140,.25);
  transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
#cry:active{transform:translateY(8px);box-shadow:0 2px 0 var(--face-dark),0 6px 14px rgba(60,90,140,.25)}
#cry:focus-visible{outline:4px solid var(--tear);outline-offset:6px}
#cry:disabled{opacity:.7}
#cry svg{width:100%;height:100%;display:block}
#cry.wobble{animation:wob .5s}
@keyframes wob{0%,100%{rotate:0}25%{rotate:-6deg}50%{rotate:5deg}75%{rotate:-3deg}}
.tear{animation:drip 1.6s ease-in infinite}
.tear.r{animation-delay:.8s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tear,#cry.wobble{animation:none}}
.label{font-size:26px;font-weight:900;letter-spacing:.04em}
.status{min-height:1.4em;font-size:15px;color:var(--muted);text-align:center;line-height:1.6}
.status.ok{color:var(--tear);font-weight:700}
section{background:var(--card);border-radius:20px;padding:18px 18px 8px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:17px;margin:0}
.count{font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
li:first-child{border-top:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--face);flex:none;margin-top:7px}
.when{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.date{font-weight:700;font-size:16px}
.time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.wx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;background:var(--bg);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.chip.down{color:var(--down);font-weight:700}
.chip.up{color:var(--up);font-weight:700}
.chip.none{color:var(--muted)}
.del{font-family:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
.del.sure{border-color:var(--danger);color:var(--danger);font-weight:700}
.empty{color:var(--muted);font-size:15px;line-height:1.7;padding:8px 0 14px}
.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>痛いよーノート</h1>
  <div class="hero">
    <button id="cry" aria-label="痛いよー（いまの日時と天気を記録する）">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="52" cy="118" rx="16" ry="10" fill="var(--cheek)" opacity=".7"/>
        <ellipse cx="148" cy="118" rx="16" ry="10" fill="var(--cheek)" opacity=".7"/>
        <path d="M50 80 L74 90 L50 100" fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M150 80 L126 90 L150 100" fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="tear" d="M62 106 q-7 12 0 16 q7 -4 0 -16z" fill="var(--tear)"/>
        <path class="tear r" d="M138 106 q-7 12 0 16 q7 -4 0 -16z" fill="var(--tear)"/>
        <path d="M78 150 Q100 120 122 150 Q100 140 78 150z" fill="var(--fg)"/>
      </svg>
    </button>
    <div class="label">痛いよー</div>
    <div class="status" id="status" role="status">押すと、いまの日時と天気・気圧を記録するよ</div>
  </div>

  <section>
    <div class="head"><h2>記録</h2><span class="count" id="count"></span></div>
    <ul id="list"></ul>
    <p class="empty" id="empty">まだ記録はないよ。<br>痛くなったら、上の顔を押してね。</p>
  </section>
  <p class="note">記録はこのスマホの中にだけ保存されます。<br>天気データ：Open-Meteo</p>
</div>

<script>
const KEY = "itaiyo-note-v1";
const HOME = { lat: 35.911, lon: 140.050, name: "取手" }; // 位置が取れないときの代わり
const WD = ["日","月","火","水","木","金","土"];
const $ = s => document.querySelector(s);

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(rows){ try { localStorage.setItem(KEY, JSON.stringify(rows)); return true; } catch(e){ return false; } }
let rows = load();

function say(t, ok){ const s=$("#status"); s.textContent=t; s.classList.toggle("ok",!!ok); }
const pad = n => String(n).padStart(2,"0");

function wxName(c){
  if (c === 0) return "晴れ";
  if (c <= 2) return "晴れ時々くもり";
  if (c === 3) return "くもり";
  if (c <= 48) return "霧";
  if (c <= 57) return "霧雨";
  if (c <= 67) return "雨";
  if (c <= 77) return "雪";
  if (c <= 82) return "にわか雨";
  if (c <= 86) return "にわか雪";
  return "雷雨";
}

function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude, name: "いまの場所" }),
      () => res(null),
      { timeout: 8000, maximumAge: 600000 }
    );
  });
}

async function getWeather(pos){
  const u = "https://api.open-meteo.com/v1/forecast?latitude=" + pos.lat.toFixed(3) + "&longitude=" + pos.lon.toFixed(3) +
    "&current=temperature_2m,relative_humidity_2m,pressure_msl,weather_code" +
    "&hourly=pressure_msl&past_days=1&forecast_days=1&timezone=Asia%2FTokyo";
  const r = await fetch(u);
  if (!r.ok) throw new Error("weather");
  const j = await r.json();
  const c = j.current;
  // いまの時刻に一番近い1時間ごとの気圧を探して、3時間前・6時間前と比べる
  const hourKey = c.time.slice(0,13) + ":00";
  const i = j.hourly.time.indexOf(hourKey);
  const p = j.hourly.pressure_msl;
  const diff = h => (i >= h && p[i-h] != null) ? Math.round((c.pressure_msl - p[i-h]) * 10) / 10 : null;
  return {
    place: pos.name,
    weather: wxName(c.weather_code),
    temp: Math.round(c.temperature_2m * 10) / 10,
    humidity: Math.round(c.relative_humidity_2m),
    pressure: Math.round(c.pressure_msl * 10) / 10,
    d3: diff(3),
    d6: diff(6)
  };
}

function diffChip(label, v){
  if (v == null) return "";
  const cls = v <= -1 ? "down" : v >= 1 ? "up" : "";
  const sign = v > 0 ? "+" : "";
  return `<span class="chip ${cls}">${label} ${sign}${v}hPa</span>`;
}

function render(){
  const list = $("#list"); list.textContent = "";
  $("#empty").hidden = rows.length > 0;
  $("#count").textContent = rows.length ? rows.length + "回" : "";
  for (const r of rows){
    const d = new Date(r.at);
    const li = document.createElement("li");
    const w = r.wx;
    const wxHtml = w
      ? `<span class="chip">${w.weather}</span><span class="chip">${w.temp}℃</span><span class="chip">湿度${w.humidity}%</span><span class="chip">${w.pressure}hPa</span>${diffChip("3時間で", w.d3)}${diffChip("6時間で", w.d6)}`
      : `<span class="chip none">天気は取れなかったよ</span>`;
    li.innerHTML = `<span class="dot"></span><div class="when"><span class="date">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）</span><span class="time">${pad(d.getHours())}:${pad(d.getMinutes())}${w && w.place ? "・" + w.place : ""}</span><div class="wx">${wxHtml}</div></div><button class="del">消す</button>`;
    const b = li.querySelector(".del");
    b.onclick = () => {
      if (!b.classList.contains("sure")){
        b.classList.add("sure"); b.textContent = "本当に消す？";
        setTimeout(() => { b.classList.remove("sure"); b.textContent = "消す"; }, 3000);
        return;
      }
      rows = rows.filter(x => x.at !== r.at); save(rows); render();
    };
    list.appendChild(li);
  }
}

$("#cry").onclick = async () => {
  const btn = $("#cry");
  btn.classList.remove("wobble"); void btn.offsetWidth; btn.classList.add("wobble");
  btn.disabled = true;
  const at = Date.now();
  const rec = { at, wx: null };
  rows = [rec, ...rows]; save(rows); render();
  say("記録したよ。いま天気を調べてる…");
  try {
    const pos = (await getPos()) || HOME;
    rec.wx = await getWeather(pos);
    save(rows); render();
    const d = new Date(at);
    say(`${pad(d.getHours())}:${pad(d.getMinutes())} に記録したよ。つらいね、よく押したな`, true);
  } catch(e){
    say("日時は記録したよ。天気は取れなかった（電波を確認してね）");
  }
  btn.disabled = false;
};

render();
</script>
</body>
</html>
