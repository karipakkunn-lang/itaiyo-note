<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="痛いよー">
<title>痛いよーノート</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --fg:#2e3542; --muted:#7a8494;
  --line:#dde3ea; --face:#a9c4ec; --face-dark:#7e9fd4; --tear:#5f8fe0; --cheek:#f2b8c2;
  --down:#c9545f; --up:#3f8a6b; --danger:#c9545f;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1b2029; --card:#252b36; --fg:#e8ecf2; --muted:#9aa4b4;
  --line:#343c4a; --face:#7f9fd0; --face-dark:#5d7db3; --tear:#a8c6ff; --cheek:#d98a99;
  --down:#ef8790; --up:#7fcca8; --danger:#ef8790; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--round);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:18px;font-weight:700;margin:0;color:var(--muted);text-align:center;letter-spacing:.06em}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px}
#cry{width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:var(--face);box-shadow:0 10px 0 var(--face-dark),0 18px 30px rgba(60,90,140,.25);
  transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
#cry:active{transform:translateY(8px);box-shadow:0 2px 0 var(--face-dark),0 6px 14px rgba(60,90,140,.25)}
#cry:focus-visible{outline:4px solid var(--tear);outline-offset:6px}
#cry:disabled{opacity:.7}
#cry svg{width:100%;height:100%;display:block}
#cry.wobble{animation:wob .5s}
@keyframes wob{0%,100%{rotate:0}25%{rotate:-6deg}50%{rotate:5deg}75%{rotate:-3deg}}
.tear{animation:drip 1.6s ease-in infinite}
.tear.r{animation-delay:.8s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tear,#cry.wobble{animation:none}}
.label{font-size:26px;font-weight:900;letter-spacing:.04em}
.status{min-height:1.4em;font-size:15px;color:var(--muted);text-align:center;line-height:1.6}
.status.ok{color:var(--tear);font-weight:700}
section{background:var(--card);border-radius:20px;padding:18px 18px 8px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:17px;margin:0}
.count{font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
li:first-child{border-top:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--face);flex:none;margin-top:7px}
.when{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.date{font-weight:700;font-size:16px}
.time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.wx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;background:var(--bg);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.chip.down{color:var(--down);font-weight:700}
.chip.up{color:var(--up);font-weight:700}
.chip.none{color:var(--muted)}
.del{font-family:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
.del.sure{border-color:var(--danger);color:var(--danger);font-weight:700}
.empty{color:var(--muted);font-size:15px;line-height:1.7;padding:8px 0 14px}
.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{font-family:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tag.on{border-color:var(--tear);background:var(--tear);color:var(--card)}
.tag:disabled{opacity:.4}
.quick-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.chip.t{background:var(--face);color:#1e2a3d;font-weight:700}
.extra{font-size:14px;line-height:1.6;margin-top:2px;word-break:break-word}
.btns{display:flex;flex-direction:column;gap:6px;flex:none}
.edit{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:12px;background:var(--bg);border-radius:14px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.edit input,.edit textarea{font-family:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.edit .quick{justify-content:flex-start}
.edit .tag{font-size:13px;padding:6px 10px}
.tabs{display:flex;gap:6px;justify-content:center}
.tabs .tag{min-width:90px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.wk div{border:1px solid #cfd6df;border-radius:6px;padding:3px 0}
.wk b{display:block;font-size:15px}
.wk .hi{background:#fde8ea;border-color:#e3a3aa}
.tod{grid-template-columns:repeat(4,minmax(0,1fr))}
.levelq{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tag.lv.on{background:var(--down);border-color:var(--down)}
.chip.lv{background:var(--down);color:#fff;font-weight:700}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{font-family:inherit;font-size:15px;font-weight:700;text-align:center;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:12px;cursor:pointer}
#report{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rp-bar .tool{padding:8px 14px;font-size:14px}
.paper{background:#fff;color:#1f2633;border-radius:12px;padding:16px 14px;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.paper h2{font-size:19px;margin:0 0 2px}
.paper .sub{font-size:12px;color:#5b6575;margin-bottom:14px}
.paper h3{font-size:14px;margin:12px 0 4px;padding-bottom:4px;border-bottom:2px solid #1f2633}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sum div{border:1px solid #cfd6df;border-radius:8px;padding:6px 6px;text-align:center}
.sum b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.sum span{font-size:10.5px;color:#5b6575;line-height:1.3;display:block}
.pl{margin:0;padding-left:1.2em;font-size:13px;list-style:disc}
.paper li{display:list-item;border:none;padding:2px 0}
.recs{display:flex;flex-direction:column;font-size:12.5px;font-variant-numeric:tabular-nums}
.rec{padding:5px 0;border-bottom:1px solid #dde2e9;display:flex;flex-direction:column;gap:1px}
.rec .l1{display:flex;flex-wrap:wrap;gap:0 10px;font-weight:700}
.rec .l2{display:flex;flex-wrap:wrap;gap:0 10px;color:#3b4453}
.rec .lv3{color:#b3333f}
.dn{color:#b3333f;font-weight:700}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:520px}
.tbl th,.tbl td{border:1px solid #cfd6df;padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:#eef1f5;white-space:nowrap}
.tbl td:nth-child(-n+6){white-space:nowrap}
.tbl .dn{color:#b3333f;font-weight:700}
@media print{body{background:#fff;padding:0}.rp-bar{display:none}.paper{border-radius:0;padding:0}}
.save{font-family:inherit;font-size:15px;font-weight:700;border:none;background:var(--tear);color:var(--card);border-radius:999px;padding:10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>痛いよーノート</h1>
  <div class="tabs" id="tabs"></div>
  <div class="hero">
    <button id="cry" aria-label="痛いよー（いまの日時と天気を記録する）">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="52" cy="118" rx="16" ry="10" fill="var(--cheek)" opacity=".7"/>
        <ellipse cx="148" cy="118" rx="16" ry="10" fill="var(--cheek)" opacity=".7"/>
        <path d="M50 80 L74 90 L50 100" fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M150 80 L126 90 L150 100" fill="none" stroke="var(--fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="tear" d="M62 106 q-7 12 0 16 q7 -4 0 -16z" fill="var(--tear)"/>
        <path class="tear r" d="M138 106 q-7 12 0 16 q7 -4 0 -16z" fill="var(--tear)"/>
        <path d="M78 150 Q100 120 122 150 Q100 140 78 150z" fill="var(--fg)"/>
      </svg>
    </button>
    <div class="label">痛いよー</div>
    <div class="status" id="status" role="status">押すと、いまの日時と天気・気圧を記録するよ</div>
    <div class="levelq" id="levelq"><span>どのくらい？</span><div class="quick" id="level"></div></div>
    <div class="quick" id="quick"></div>
    <div class="quick-hint">↑ いちばん新しい記録につくよ（選ばなくても大丈夫）</div>
  </div>

  <section>
    <div class="head"><h2>記録</h2><span class="count" id="count"></span></div>
    <ul id="list"></ul>
    <p class="empty" id="empty">この人の記録はまだないよ。<br>痛くなったら、上の顔を押してね。</p>
  </section>

  <div class="tools">
    <button class="tool" id="openReport">🩺 先生に見せる画面</button>
    <button class="tool" id="exportBtn">📤 記録を書き出す</button>
    <label class="tool" for="importFile">📥 記録を読みこむ</label>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <p class="note">記録はこのスマホの中にだけ保存されます。<br>ときどき「書き出す」で控えをとっておくと安心だよ。<br>天気データ：Open-Meteo</p>
</div>

<div id="report" hidden>
  <div class="rp-bar">
    <button class="tool" id="closeReport">← もどる</button>
    <div class="quick" id="range"></div>
  </div>
  <div class="paper" id="paper"></div>
</div>

<script>
const KEY = "itaiyo-note-v1";
const HOME = { lat: 35.911, lon: 140.050, name: "取手" }; // 位置が取れないときの代わり
const WD = ["日","月","火","水","木","金","土"];
const $ = s => document.querySelector(s);

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(rows){ try { localStorage.setItem(KEY, JSON.stringify(rows)); return true; } catch(e){ return false; } }
let rows = load();
const PEOPLE = [
  { id:"anju", name:"杏樹", tags:["cold","period","med"] },
  { id:"shizuku", name:"雫", tags:["cold","school","med"] }
];
let cur = "anju";
try { cur = localStorage.getItem("itaiyo-who") || "anju"; } catch(e){}
if (!PEOPLE.find(p => p.id === cur)) cur = "anju";
const person = () => PEOPLE.find(p => p.id === cur);
const view = () => rows.filter(r => (r.who || "anju") === cur);
function renderTabs(){
  const t = $("#tabs"); t.textContent = "";
  for (const p of PEOPLE){
    const b = document.createElement("button");
    b.className = "tag" + (p.id === cur ? " on" : "");
    b.textContent = p.name;
    b.onclick = () => { cur = p.id; openEdit = null; try { localStorage.setItem("itaiyo-who", cur); } catch(e){} render(); };
    t.appendChild(b);
  }
}

function say(t, ok){ const s=$("#status"); s.textContent=t; s.classList.toggle("ok",!!ok); }
const pad = n => String(n).padStart(2,"0");

function wxName(c){
  if (c === 0) return "晴れ";
  if (c <= 2) return "晴れ時々くもり";
  if (c === 3) return "くもり";
  if (c <= 48) return "霧";
  if (c <= 57) return "霧雨";
  if (c <= 67) return "雨";
  if (c <= 77) return "雪";
  if (c <= 82) return "にわか雨";
  if (c <= 86) return "にわか雪";
  return "雷雨";
}

function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude, name: "いまの場所" }),
      () => res(null),
      { timeout: 8000, maximumAge: 600000 }
    );
  });
}

async function getWeather(pos){
  const u = "https://api.open-meteo.com/v1/forecast?latitude=" + pos.lat.toFixed(3) + "&longitude=" + pos.lon.toFixed(3) +
    "&current=temperature_2m,relative_humidity_2m,pressure_msl,weather_code" +
    "&hourly=pressure_msl&past_days=1&forecast_days=1&timezone=Asia%2FTokyo";
  const r = await fetch(u);
  if (!r.ok) throw new Error("weather");
  const j = await r.json();
  const c = j.current;
  // いまの時刻に一番近い1時間ごとの気圧を探して、3時間前・6時間前と比べる
  const hourKey = c.time.slice(0,13) + ":00";
  const i = j.hourly.time.indexOf(hourKey);
  const p = j.hourly.pressure_msl;
  const diff = h => (i >= h && p[i-h] != null) ? Math.round((c.pressure_msl - p[i-h]) * 10) / 10 : null;
  return {
    place: pos.name,
    weather: wxName(c.weather_code),
    temp: Math.round(c.temperature_2m * 10) / 10,
    humidity: Math.round(c.relative_humidity_2m),
    pressure: Math.round(c.pressure_msl * 10) / 10,
    d3: diff(3),
    d6: diff(6)
  };
}

function diffChip(label, v){
  if (v == null) return "";
  const cls = v <= -1 ? "down" : v >= 1 ? "up" : "";
  const sign = v > 0 ? "+" : "";
  return `<span class="chip ${cls}">${label} ${sign}${v}hPa</span>`;
}

const TAGS = [
  { id:"cold", label:"🤧 風邪っぽい" },
  { id:"period", label:"🚺 生理" },
  { id:"med", label:"💊 薬のんだ" },
  { id:"school", label:"🏫 休んだ・早退" }
];
let openEdit = null; // 書きたし中の記録

function toggleTag(rec, id){
  rec.tags = rec.tags || [];
  rec.tags = rec.tags.includes(id) ? rec.tags.filter(t => t !== id) : [...rec.tags, id];
}

const LEVELS = [ { v:1, label:"弱い" }, { v:2, label:"ふつう" }, { v:3, label:"つよい" } ];
const levelName = v => (LEVELS.find(l => l.v === v) || {}).label || "";

function levelButtons(target, onPick){
  const box = document.createElement("div"); box.className = "quick";
  for (const l of LEVELS){
    const b = document.createElement("button");
    b.className = "tag lv" + (target && target.level === l.v ? " on" : "");
    b.textContent = l.label;
    b.disabled = !target;
    b.onclick = () => { target.level = target.level === l.v ? null : l.v; onPick(b); };
    box.appendChild(b);
  }
  return box;
}

function renderQuick(){
  const latest = view()[0];
  const lv = $("#level"); lv.textContent = "";
  lv.append(...levelButtons(latest, () => { save(rows); render(); }).childNodes);
  const q = $("#quick"); q.textContent = "";
  for (const t of TAGS.filter(x => person().tags.includes(x.id))){
    const b = document.createElement("button");
    b.className = "tag" + (latest && (latest.tags||[]).includes(t.id) ? " on" : "");
    b.textContent = t.label;
    b.disabled = !latest;
    b.onclick = () => { toggleTag(latest, t.id); save(rows); render(); };
    q.appendChild(b);
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function editForm(r){
  const box = document.createElement("div");
  box.className = "edit";
  const tmp = { tags: [...(r.tags||[])], level: r.level ?? null };
  box.innerHTML = `<div class="lvbox"></div><div class="quick"></div>
    <label>体温（℃）<input type="number" inputmode="decimal" step="0.1" min="34" max="42" id="temp-${r.at}" value="${r.temp ?? ""}" placeholder="例：37.2"></label>
    <label>飲んだ薬<input type="text" id="med-${r.at}" value="${esc(r.medName || "")}" placeholder="例：ロキソニン 1錠"></label>
    <label>メモ<textarea rows="2" id="memo-${r.at}" placeholder="例：右側がズキズキ、寝不足">${esc(r.memo || "")}</textarea></label>
    <button class="save">保存する</button>`;
  const lvb = levelButtons(tmp, () => {
    lvb.querySelectorAll(".tag").forEach((x, i) => x.classList.toggle("on", tmp.level === LEVELS[i].v));
  });
  box.querySelector(".lvbox").appendChild(lvb);
  const q = box.querySelector(".lvbox + .quick");
  for (const t of TAGS.filter(x => person().tags.includes(x.id) || tmp.tags.includes(x.id))){
    const b = document.createElement("button");
    b.className = "tag" + (tmp.tags.includes(t.id) ? " on" : "");
    b.textContent = t.label;
    b.onclick = () => { toggleTag(tmp, t.id); b.classList.toggle("on"); };
    q.appendChild(b);
  }
  box.querySelector(".save").onclick = () => {
    const tv = parseFloat(box.querySelector("#temp-" + r.at).value);
    r.temp = isNaN(tv) ? null : Math.round(tv * 10) / 10;
    r.medName = box.querySelector("#med-" + r.at).value.trim();
    r.memo = box.querySelector("#memo-" + r.at).value.trim();
    r.tags = tmp.tags;
    r.level = tmp.level;
    if (r.medName && !r.tags.includes("med")) r.tags.push("med");
    openEdit = null; save(rows); render();
    say("書きたしたよ", true);
  };
  return box;
}

function render(){
  renderTabs();
  renderQuick();
  const vrows = view();
  $("#cry").setAttribute("aria-label", person().name + "の痛いよー（いまの日時と天気を記録する）");
  const list = $("#list"); list.textContent = "";
  $("#empty").hidden = vrows.length > 0;
  $("#count").textContent = vrows.length ? vrows.length + "回" : "";
  for (const r of vrows){
    const d = new Date(r.at);
    const li = document.createElement("li");
    const w = r.wx;
    const wxHtml = w
      ? `<span class="chip">${w.weather}</span><span class="chip">${w.temp}℃</span><span class="chip">湿度${w.humidity}%</span><span class="chip">${w.pressure}hPa</span>${diffChip("3時間で", w.d3)}${diffChip("6時間で", w.d6)}`
      : `<span class="chip none">天気は取れなかったよ</span>`;
    const tagHtml = (r.level ? `<span class="chip lv">痛み：${levelName(r.level)}</span>` : "") + (r.tags||[]).map(id => { const t = TAGS.find(x => x.id === id); return t ? `<span class="chip t">${t.label}</span>` : ""; }).join("");
    const extras = [
      r.temp != null ? `🌡️ ${r.temp}℃` : "",
      r.medName ? `💊 ${esc(r.medName)}` : "",
      r.memo ? `📝 ${esc(r.memo)}` : ""
    ].filter(Boolean).map(s => `<div class="extra">${s}</div>`).join("");
    li.innerHTML = `<span class="dot"></span><div class="when"><span class="date">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）</span><span class="time">${pad(d.getHours())}:${pad(d.getMinutes())}${w && w.place ? "・" + w.place : ""}</span>${tagHtml ? `<div class="wx">${tagHtml}</div>` : ""}${extras}<div class="wx">${wxHtml}</div></div><div class="btns"><button class="del add">書きたす</button><button class="del">消す</button></div>`;
    li.querySelector(".add").onclick = () => { openEdit = openEdit === r.at ? null : r.at; render(); };
    if (openEdit === r.at) li.querySelector(".when").appendChild(editForm(r));
    const b = li.querySelector(".del:not(.add)");
    b.onclick = () => {
      if (!b.classList.contains("sure")){
        b.classList.add("sure"); b.textContent = "本当に消す？";
        setTimeout(() => { b.classList.remove("sure"); b.textContent = "消す"; }, 3000);
        return;
      }
      rows = rows.filter(x => x.at !== r.at); save(rows); render();
    };
    list.appendChild(li);
  }
}

$("#cry").onclick = async () => {
  const btn = $("#cry");
  btn.classList.remove("wobble"); void btn.offsetWidth; btn.classList.add("wobble");
  btn.disabled = true;
  const at = Date.now();
  const rec = { at, who: cur, wx: null };
  rows = [rec, ...rows]; save(rows); render();
  say("記録したよ。いま天気を調べてる…");
  try {
    const pos = (await getPos()) || HOME;
    rec.wx = await getWeather(pos);
    save(rows); render();
    const d = new Date(at);
    say(`${pad(d.getHours())}:${pad(d.getMinutes())} に記録したよ。つらいね、よく押したな`, true);
  } catch(e){
    say("日時は記録したよ。天気は取れなかった（電波を確認してね）");
  }
  btn.disabled = false;
};

/* ---------- 書き出し・読みこみ ---------- */
$("#exportBtn").onclick = async () => {
  const d = new Date();
  const name = `itaiyo-note-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  const text = JSON.stringify({ app:"itaiyo-note", version:1, exportedAt:d.toISOString(), rows }, null, 1);
  const file = new File([text], name, { type:"application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:"痛いよーノートの控え" });
      say("書き出したよ。「ファイルに保存」でしまっておいてね", true);
      return;
    }
  } catch(e){ if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  say("書き出したよ（ダウンロードに入ってるよ）", true);
};

$("#importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = Array.isArray(data) ? data : data.rows;
    if (!Array.isArray(incoming)) throw new Error("bad");
    const map = new Map(rows.map(r => [r.at, r]));
    let added = 0;
    for (const r of incoming){
      if (typeof r.at !== "number") continue;
      if (!map.has(r.at)) added++;
      map.set(r.at, { ...map.get(r.at), ...r });
    }
    rows = [...map.values()].sort((a, b) => b.at - a.at);
    save(rows); render();
    say(`読みこんだよ。${added}件ふえたよ`, true);
    window.scrollTo({ top:0, behavior:"smooth" });
  } catch(err){
    say("このファイルは読みこめなかったよ。書き出した .json ファイルを選んでね");
    window.scrollTo({ top:0, behavior:"smooth" });
  }
};

/* ---------- 先生に見せる画面 ---------- */
let months = 1;
const fmtD = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };

function renderReport(){
  const rg = $("#range"); rg.textContent = "";
  for (const m of [1, 3]){
    const b = document.createElement("button");
    b.className = "tag" + (months === m ? " on" : "");
    b.textContent = m + "か月";
    b.onclick = () => { months = m; renderReport(); };
    rg.appendChild(b);
  }
  const end = new Date();
  const start = new Date(end); start.setMonth(start.getMonth() - months); start.setHours(0,0,0,0);
  const list = view().filter(r => r.at >= start.getTime()).sort((a, b) => a.at - b.at);
  const days = new Set(list.map(r => dayKey(r.at)));
  const has = (r, t) => (r.tags || []).includes(t);
  const medDays = new Set(list.filter(r => has(r, "med")).map(r => dayKey(r.at)));
  const perDays = new Set(list.filter(r => has(r, "period")).map(r => dayKey(r.at)));
  const coldDays = new Set(list.filter(r => has(r, "cold")).map(r => dayKey(r.at)));
  const lvCount = v => list.filter(r => r.level === v).length;
  const noLv = list.filter(r => !r.level).length;
  const d6s = list.map(r => r.wx && r.wx.d6).filter(v => v != null);
  const d3s = list.map(r => r.wx && r.wx.d3).filter(v => v != null);
  const avg = a => a.length ? (Math.round(a.reduce((s, v) => s + v, 0) / a.length * 10) / 10) : null;
  const drop6 = d6s.filter(v => v <= -1).length;
  const sg = v => { if (v == null) return "—"; v = Math.round(v * 10) / 10; return (v > 0 ? "+" : "") + v; };
  const fd = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

  const schoolDays = new Set(list.filter(r => has(r, "school")).map(r => dayKey(r.at)));
  const wk = [0,0,0,0,0,0,0]; list.forEach(r => wk[new Date(r.at).getDay()]++);
  const wkMax = Math.max(...wk);
  const wkOrder = [1,2,3,4,5,6,0];
  const wkHtml = wkOrder.map(i => `<div class="${wk[i] && wk[i] === wkMax ? "hi" : ""}">${WD[i]}<b>${wk[i]}</b></div>`).join("");
  const TOD = [["朝","5〜10時",5,11],["昼","11〜15時",11,16],["夕方","16〜19時",16,20],["夜","20〜4時",20,29]];
  const tc = TOD.map(([, , a, b]) => list.filter(r => { let h = new Date(r.at).getHours(); if (h < 5) h += 24; return h >= a && h < b; }).length);
  const tMax = Math.max(...tc);
  const todHtml = TOD.map((x, i) => `<div class="${tc[i] && tc[i] === tMax ? "hi" : ""}">${x[0]}<b>${tc[i]}</b><span style="font-size:10px;color:#5b6575">${x[1]}</span></div>`).join("");
  const rowsHtml = list.map(r => {
    const w = r.wx || {};
    const tags = (r.tags || []).map(id => ({ cold:"風邪", period:"生理", med:"服薬", school:"休み・早退" }[id])).filter(Boolean).join("・");
    const t = new Date(r.at);
    const cls = v => v != null && v <= -1 ? "dn" : "";
    const l2 = [
      w.pressure != null ? `${w.pressure}hPa（3h <span class="${cls(w.d3)}">${sg(w.d3)}</span> / 6h <span class="${cls(w.d6)}">${sg(w.d6)}</span>）` : "気圧 —",
      w.weather || "",
      r.temp != null ? r.temp + "℃" : "",
      r.medName ? esc(r.medName) : "",
      r.memo ? esc(r.memo) : ""
    ].filter(Boolean).map(x => `<span>${x}</span>`).join("");
    return `<div class="rec"><div class="l1"><span>${fmtD(r.at)} ${pad(t.getHours())}:${pad(t.getMinutes())}</span><span class="${r.level === 3 ? "lv3" : ""}">${levelName(r.level) || "強さ —"}</span>${tags ? `<span>${tags}</span>` : ""}</div><div class="l2">${l2}</div></div>`;
  }).join("");

  $("#paper").innerHTML = `
    <h2>${person().name}の頭痛の記録</h2>
    <div class="sub">期間：${fd(start)} 〜 ${fd(end)}（${months}か月）／痛いよーノートより</div>
    <div class="sum">
      <div><b>${days.size}日</b><span>頭痛が<br>あった日</span></div>
      <div><b>${list.length}回</b><span>記録した<br>回数</span></div>
      <div><b>${medDays.size}日</b><span>薬を<br>飲んだ日</span></div>
      ${person().tags.includes("period")
        ? `<div><b>${[...days].filter(d => perDays.has(d)).length}日</b><span>生理と<br>重なった日</span></div>`
        : `<div><b>${schoolDays.size}日</b><span>休んだ・<br>早退した日</span></div>`}
    </div>
    <h3>痛みの強さ</h3>
    <ul class="pl">
      <li>つよい：${lvCount(3)}回　ふつう：${lvCount(2)}回　弱い：${lvCount(1)}回${noLv ? `　（未選択：${noLv}回）` : ""}</li>
      ${coldDays.size ? `<li>風邪っぽい症状があった日：${coldDays.size}日</li>` : ""}
    </ul>
    <h3>曜日ごとの回数</h3>
    <div class="wk">${wkHtml}</div>
    <h3>時間帯ごとの回数</h3>
    <div class="wk tod">${todHtml}</div>
    <h3>気圧との関係</h3>
    <ul class="pl">
      <li>頭痛のとき、6時間前より気圧が1hPa以上下がっていた：${drop6}回 / ${d6s.length}回</li>
      <li>気圧の変化の平均：3時間で ${sg(avg(d3s))}hPa、6時間で ${sg(avg(d6s))}hPa</li>
    </ul>
    <h3>記録の一覧</h3>
    ${list.length ? `<div class="recs">${rowsHtml}</div>` : `<p>この期間の記録はまだありません。</p>`}
  `;
}

$("#openReport").onclick = () => { renderReport(); $(".wrap").hidden = true; $("#report").hidden = false; window.scrollTo(0, 0); };
$("#closeReport").onclick = () => { $("#report").hidden = true; $(".wrap").hidden = false; window.scrollTo(0, 0); };

render();
</script>
</body>
</html>
